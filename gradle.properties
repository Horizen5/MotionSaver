org.gradle.jvmargs=-Xmx3072m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# R8 full mode：允许更激进的跨类优化与无用代码删除
android.enableR8.fullMode=true
# 让 AGP 把 src/main/baseline-prof.txt 编译进 APK 的 assets/dexopt
android.experimental.enableArtProfiles=true
# 用 startup profile 做 dex 布局优化（AGP 8.x）
android.experimental.r8.dex-startup-optimization=true
